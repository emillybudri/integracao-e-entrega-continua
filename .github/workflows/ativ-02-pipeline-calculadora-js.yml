name: Atividade 02 - Pipeline Calculadora de CI com JavaScript (19/08/2026)

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'ativ-02/**'
      - '.github/workflows/ativ-02-pipeline.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'ativ-02/**'
      - '.github/workflows/ativ-02-pipeline.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Job 1: Testes de Soma
  teste-soma:
    name: Teste de Soma
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: |
          cd ativ-02
          npm install

      - name: Executar teste de soma
        run: |
          cd ativ-02
          npm run test:soma

  # Job 2: Testes de Subtração
  teste-subtracao:
    name: Teste de Subtração
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: |
          cd ativ-02
          npm install

      - name: Executar teste de subtração
        run: |
          cd ativ-02
          npm run test:subtracao

  # Job 3: Testes de Multiplicação
  teste-multiplicacao:
    name: Teste de Multiplicação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: |
          cd ativ-02
          npm install

      - name: Executar teste de multiplicação
        run: |
          cd ativ-02
          npm run test:multiplicacao

  # Job 4: Testes de Divisão
  teste-divisao:
    name: Teste de Divisão
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: |
          cd ativ-02
          npm install

      - name: Executar teste de divisão
        run: |
          cd ativ-02
          npm run test:divisao

  # Job 5: Deploy
  deploy:
    name: Deploy
    needs: [teste-soma, teste-subtracao, teste-multiplicacao, teste-divisao]
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy
        run: echo "Deploy Realizado"
