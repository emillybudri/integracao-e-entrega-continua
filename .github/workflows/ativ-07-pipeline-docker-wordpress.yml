name: Atividade 07 - Pipeline WordPress e MariaDB (02/10/2026)

on:
  push:
    branches: [ main, dev, "feat/*" ]
    paths:
      - 'ativ-07/**'
      - '.github/workflows/ativ-07-pipeline-docker-wordpress.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'ativ-07/**'
      - '.github/workflows/ativ-07-pipeline-docker-wordpress.yml'

jobs:
  validar-configuracao:
    name: 1. Validação de Sintaxe Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Validar sintaxe do docker-compose.yml
        run: |
          cd ativ-07
          docker compose config

  testar-ambiente-wordpress:
    name: 2. Teste e Subida do Ambiente Multi-Container
    needs: validar-configuracao
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Subir containers WordPress e MariaDB
        run: |
          cd ativ-07
          docker compose up -d --build

      - name: Aguardar inicialização do Banco e do WordPress
        run: |
          echo "Aguardando o MariaDB estar pronto (healthy)..."
          timeout 60s bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" mariadb_wordpress)" == "healthy" ]; do sleep 2; done'
          echo "MariaDB está saudável e pronto para conexões!"

          echo "Aguardando a instalação automática do WordPress (até 3 minutos)..."
          if ! timeout 180s bash -c 'until curl -s http://localhost:8081/ | grep -q "site-header"; do sleep 3; done'; then
            echo "❌ O site não ficou pronto a tempo"
            docker logs wordpress_web
            exit 1
          fi
          echo "WordPress instalado e com o tema ativo!"

      - name: Validar resposta da aplicação Web WordPress
        run: |
          echo "Testando requisição HTTP no WordPress..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081 || echo "000")
          echo "Código HTTP recebido: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ WordPress respondendo com sucesso!"
          else
            echo "❌ Erro ao acessar o WordPress"
            docker logs wordpress_web
            exit 1
          fi

      - name: Validar publicações iniciais e tela de login
        run: |
          POSTS=$(curl -s http://localhost:8081/ | grep -c 'class="post-thumb"' || true)
          echo "Publicações com imagem na página inicial: $POSTS"
          [ "$POSTS" -ge 4 ] || { echo "❌ Publicações iniciais não foram criadas"; docker logs wordpress_web; exit 1; }
          LOGIN=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/wp-login.php)
          echo "wp-login.php: HTTP $LOGIN"
          [ "$LOGIN" -eq 200 ] || exit 1

      - name: Exibir status final dos containers
        run: |
          cd ativ-07
          docker compose ps

      - name: Finalizar e limpar ambiente
        if: always()
        run: |
          cd ativ-07
          docker compose down -v

  testar-modo-demonstracao:
    name: 3. Teste da imagem sem banco externo (modo demonstração)
    needs: validar-configuracao
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir a imagem e subir sem nenhuma variável de ambiente
        run: |
          cd ativ-07
          docker build -t portal-demo .
          docker run -d --name portal-demo -p 8082:80 portal-demo

      - name: Aguardar a instalação automática e validar o site
        run: |
          if ! timeout 180s bash -c 'until curl -s http://localhost:8082/ | grep -q "site-header"; do sleep 3; done'; then
            echo "❌ O site não ficou pronto a tempo"
            docker logs portal-demo
            exit 1
          fi
          # Aguarda o término do provisionamento (publicações iniciais)
          timeout 60s bash -c 'until docker logs portal-demo 2>&1 | grep -q "\[portal\] Pronto"; do sleep 2; done'
          POSTS=$(curl -s http://localhost:8082/ | grep -c 'class="post-thumb"' || true)
          echo "Publicações com imagem: $POSTS"
          [ "$POSTS" -ge 4 ] || { echo "❌ Publicações iniciais não foram criadas"; docker logs portal-demo; exit 1; }
          curl -s http://localhost:8082/wp-login.php | grep -q "Ambiente de demonstração" || { echo "❌ Tela de login sem a dica de acesso"; exit 1; }
          echo "✅ Modo demonstração (SQLite) funcionando sem preencher nada"

      - name: Finalizar e limpar
        if: always()
        run: docker rm -f portal-demo
