name: Atividade 06 - Pipeline Dockerfile Pudim (30/09/2026)

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'ativ-06/**'
      - '.github/workflows/ativ-06-pipeline-docker-pudim.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'ativ-06/**'
      - '.github/workflows/ativ-06-pipeline-docker-pudim.yml'
  workflow_dispatch:

jobs:
  validacao-arquivos:
    name: Validacao de Arquivos e HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Verificar integridade dos arquivos
        run: |
          test -f ativ-06/index.html || (echo "Erro: index.html nao encontrado" && exit 1)
          test -f ativ-06/Dockerfile || (echo "Erro: Dockerfile nao encontrado" && exit 1)
          test -f ativ-06/docker-compose.yml || (echo "Erro: docker-compose.yml nao encontrado" && exit 1)
          test -f ativ-06/dockerfile.png || (echo "Erro: dockerfile.png nao encontrado" && exit 1)
          echo "Todos os arquivos necessarios estao presentes."

  build:
    name: Build e Push da Imagem Docker
    needs: validacao-arquivos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: env.DOCKER_PASS != ''
        env:
          DOCKER_PASS: ${{ secrets.DOCKER_PASS || secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME || 'emillybudri' }}
          password: ${{ secrets.DOCKER_PASS || secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: ativ-06
          file: ativ-06/Dockerfile
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: |
            emillybudri/pudim-dockerfile:v1
            emillybudri/pudim-dockerfile:latest
            ${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME || 'emillybudri' }}/pudim-dockerfile:v1
            ${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME || 'emillybudri' }}/pudim-dockerfile:latest
        env:
          CAN_PUSH: ${{ (secrets.DOCKER_PASS != '' || secrets.DOCKERHUB_TOKEN != '') && 'true' || 'false' }}

  teste-pull-e-execucao:
    name: Pull e Verificacao da Imagem Docker
    needs: [validacao-arquivos, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Realizar Docker Pull da Imagem Publicada
        run: |
          echo "Efetuando pull da imagem pudim-dockerfile do Docker Hub..."
          docker pull emillybudri/pudim-dockerfile:latest || docker pull emillybudri/pudim-dockerfile:v1

      - name: Executar Container via Docker Compose
        run: |
          echo "Subindo container a partir da imagem usando docker-compose.yml..."
          docker compose -f ativ-06/docker-compose.yml up -d
          docker ps

      - name: Verificar se o servico responde HTTP 200 OK na porta 6767
        run: |
          echo "Verificando se a aplicacao esta rodando na porta 6767..."
          sleep 2
          curl -f http://localhost:6767 || (echo "Erro ao acessar a aplicacao rodando via Docker na porta 6767" && exit 1)
          echo "Conexao bem sucedida! A aplicacao respondeu HTTP 200 OK na porta 6767."

      - name: Finalizar e Parar Containers
        if: always()
        run: |
          docker compose -f ativ-06/docker-compose.yml down

  deploy:
    name: Deploy no Servidor Azure VM (Porta 6767)
    needs: [validacao-arquivos, build, teste-pull-e-execucao]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment: producao
    steps:
      - name: Implantar na VM via SSH (Porta 6767)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            DOCKER_USER="${{ secrets.DOCKER_USER || secrets.DOCKERHUB_USERNAME || 'emillybudri' }}"
            IMAGE_NAME="$DOCKER_USER/pudim-dockerfile:latest"

            echo "=========================================="
            echo "Iniciando CD do Site Pudim na Azure VM"
            echo "Porta Alvo: 6767"
            echo "Imagem Docker: $IMAGE_NAME"
            echo "=========================================="

            echo "1. Baixando imagem atualizada do Docker Hub..."
            docker pull $IMAGE_NAME || docker pull emillybudri/pudim-dockerfile:latest

            echo "2. Parando container anterior (se existir)..."
            docker rm -f site-pudim-app || true

            echo "3. Subindo container Pudim na porta 6767..."
            docker run -d \
              --name site-pudim-app \
              -p 6767:80 \
              --restart unless-stopped \
              $IMAGE_NAME

            echo "4. Validando containers em execucao:"
            docker ps --filter "name=site-pudim-app"

            echo "=========================================="
            echo "Deploy concluido com sucesso na porta 6767!"
            echo "=========================================="
