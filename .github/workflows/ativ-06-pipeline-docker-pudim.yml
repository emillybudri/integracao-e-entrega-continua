name: Atividade 06 - Pipeline Dockerfile Pudim (30/09/2026)

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'ativ-06/**'
      - '.github/workflows/ativ-06-pipeline-docker-pudim.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'ativ-06/**'
      - '.github/workflows/ativ-06-pipeline-docker-pudim.yml'

jobs:
  validacao-arquivos:
    name: Validacao de Arquivos e HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Verificar integridade dos arquivos
        run: |
          test -f ativ-06/index.html || (echo "Erro: index.html nao encontrado" && exit 1)
          test -f ativ-06/Dockerfile || (echo "Erro: Dockerfile nao encontrado" && exit 1)
          test -f ativ-06/dockerfile.png || (echo "Erro: dockerfile.png nao encontrado" && exit 1)
          echo "Todos os arquivos necessarios estao presentes."

  build-tag-push:
    name: Build, Tag e Push da Imagem Docker
    needs: validacao-arquivos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 1. Build da imagem Docker Pudim
        working-directory: ativ-06
        run: |
          docker build -t pudim-dockerfile:v1 .

      - name: 2. Taggear (carimbar) imagem com o usuario Docker Hub
        run: |
          docker tag pudim-dockerfile:v1 emillybudri/pudim-dockerfile:v1
          docker tag pudim-dockerfile:v1 emillybudri/pudim-dockerfile:latest
          echo "Imagem taggeada com sucesso: emillybudri/pudim-dockerfile:v1"

      - name: 3. Autenticar no Docker Hub (Se o Secret estiver configurado)
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'emillybudri' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Enviar imagem para o Docker Hub (Push)
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          docker push emillybudri/pudim-dockerfile:v1
          docker push emillybudri/pudim-dockerfile:latest
          echo "Imagem publicada no Docker Hub: emillybudri/pudim-dockerfile:v1"

  deploy:
    name: Deploy / Confirmacao
    needs: [validacao-arquivos, build-tag-push]
    runs-on: ubuntu-latest
    steps:
      - name: Confirmacao de Build
        run: |
          echo "Pipeline da Atividade 06 executada com sucesso!"
          echo "Imagem Docker do site Pudim Dockerfile pronta para publicacao no Docker Hub (emillybudri/pudim-dockerfile:v1)."
