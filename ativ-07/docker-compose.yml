services:
  database:
    image: mariadb:10.11
    container_name: mariadb_wordpress
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress_db}
      MYSQL_USER: ${MYSQL_USER:-wp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-root_secret} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    image: wordpress:latest
    container_name: wordpress_web
    restart: always
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress_db}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
    volumes:
      - wordpress_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/portal-cicd
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
    networks:
      - wordpress_net

volumes:
  db_data:
    driver: local
  wordpress_data:
    driver: local

networks:
  wordpress_net:
    driver: bridge
