services:
  database:
    image: mariadb:10.11.19
    container_name: mariadb_wordpress
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress_db}
      MYSQL_USER: ${MYSQL_USER:-wp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wordpress_net
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-root_secret} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build: .
    image: portal-cicd-wordpress:local
    container_name: wordpress_web
    restart: always
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8081}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress_db}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wp_password}
      # Instalação automática no primeiro boot (sem o assistente do WordPress).
      PORTAL_SITE_URL: http://localhost:${WP_PORT:-8081}
      PORTAL_ADMIN_USER: ${PORTAL_ADMIN_USER:-admin}
      PORTAL_ADMIN_PASSWORD: ${PORTAL_ADMIN_PASSWORD:-admin123}
      PORTAL_ADMIN_EMAIL: ${PORTAL_ADMIN_EMAIL:-admin@example.com}
      PORTAL_SEED_POSTS: ${PORTAL_SEED_POSTS:-1}
      PORTAL_LOGIN_HINT: ${PORTAL_LOGIN_HINT:-1}
    volumes:
      - wordpress_data:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/portal-cicd
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
    networks:
      - wordpress_net

volumes:
  db_data:
    driver: local
  wordpress_data:
    driver: local

networks:
  wordpress_net:
    driver: bridge
